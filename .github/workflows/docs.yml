---
name: Publish Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '.github/scripts/**'
      - 'lib/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
      - 'README.md'

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.x

      - name: Install MkDocs Material
        run: pip install mkdocs-material

      - name: Install PowerShell Modules
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted -ErrorAction SilentlyContinue
          Install-Module -Name platyPS -Force -Scope CurrentUser -AllowClobber -AcceptLicense

      - name: Generate API Documentation
        shell: pwsh
        run: |
          ./.github/scripts/Update-Documentation.ps1

      - name: Prepare Markdown Files
        run: |
          cp README.md docs/index.md
          cp SUPPORT.md docs/SUPPORT.md
          cp CONTRIBUTING.md docs/CONTRIBUTING.md

      - name: Dynamically Inject API Reference Nav
        shell: pwsh
        run: |
          $navStr = "  - API Reference:`n"

          # Add root level CLI scripts
          $rootFiles = Get-ChildItem -Path docs/reference -Filter "*.md" -File | Sort-Object Name
          foreach ($f in $rootFiles) {
              $navStr += "    - $($f.BaseName): reference/$($f.Name)`n"
          }

          # Add nested Module directories
          $dirs = Get-ChildItem -Path docs/reference -Directory | Sort-Object Name
          foreach ($d in $dirs) {
              $navStr += "    - $($d.Name):`n"
              $subFiles = Get-ChildItem -Path $d.FullName -Filter "*.md" -File | Sort-Object Name

              # Ensure index.md comes first
              $index = $subFiles | Where-Object Name -eq 'index.md'
              if ($index) {
                  $navStr += "      - Overview: reference/$($d.Name)/$($index.Name)`n"
              }

              foreach ($sf in $subFiles | Where-Object Name -ne 'index.md') {
                  $navStr += "      - $($sf.BaseName): reference/$($d.Name)/$($sf.Name)`n"
              }
          }

          $content = Get-Content mkdocs.yml -Raw
          $content = $content -replace '(?m)^\s*-\s*API Reference:\s*reference/?\s*$', $navStr
          $content | Set-Content mkdocs.yml -NoNewline

      - name: Build site
        run: mkdocs build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
