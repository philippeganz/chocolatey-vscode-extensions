---
name: Monthly Health Check

on:
  # schedule:
  #   - cron: '0 0 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health_check:
    name: Run Health Diagnostics
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Inject Local Modules into PSModulePath
        shell: pwsh
        run: echo "PSModulePath=$PWD/lib$([System.IO.Path]::PathSeparator)$env:PSModulePath" >> $env:GITHUB_ENV

      - name: Execute Repository Health Check
        id: health
        shell: pwsh
        run: |
          .github\scripts\Invoke-RepositoryHealthCheck.ps1
