---
name: Chocolatey AU Updater

on:
  # schedule:
  #   - cron: '0 0 * * *' # Run daily at midnight
  workflow_dispatch:
    inputs:
      forced_packages:
        description: Comma separated list of packages to force update (optional)
        required: false
        type: string
      moderation_repush:
        description: Comma separated list of packages to repush to moderation without timestamping (optional)
        required: false
        type: string

jobs:
  au-update:
    runs-on: windows-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.PAT }}

      - name: Upgrade Chocolatey
        run: choco upgrade chocolatey -y --no-progress

      - name: Install Chocolatey Dependencies & Test Prereqs
        run: choco install chocolatey-community-validation.extension chocolatey-vscode.extension vscode -y --no-progress

      - name: Install PowerShell Modules
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted -ErrorAction SilentlyContinue
          Install-Module -Name au -Force -Scope CurrentUser -AllowClobber -AcceptLicense
          Install-Module -Name powershell-yaml -Force -Scope CurrentUser -AllowClobber -AcceptLicense

      - name: Run AU Updater
        shell: pwsh
        env:
          api_key: ${{ secrets.CHOCO_API_KEY }}
          github_user_repo: philippeganz/chocolatey-vscode-extensions
          github_api_key: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          $forced = "${{ inputs.forced_packages }}"
          $moderation = "${{ inputs.moderation_repush }}"

          if ($moderation) {
            ./bin/Update-ExtensionPool.ps1 -ModerationRepush $moderation
          } elseif ($forced) {
            ./bin/Update-ExtensionPool.ps1 -ForcedPackages $forced
          } else {
            ./bin/Update-ExtensionPool.ps1
          }

      - name: Commit and Push Updates
        shell: pwsh
        run: |
          # Find all unique package directories that have modifications
          $status = git status --porcelain
          $modifiedPkgs = $status | ForEach-Object {
              if ($_ -match 'automatic/([^/]+)/') {
                  $Matches[1]
              }
          } | Select-Object -Unique

          if (-not $modifiedPkgs) {
              Write-Host "No changes detected. Nothing to commit."
              exit 0
          }

          foreach ($pkg in $modifiedPkgs) {
              $version = "unknown"
              $nuspecPath = "automatic/$pkg/$pkg.nuspec"
              if (Test-Path $nuspecPath) {
                  $xml = [xml](Get-Content $nuspecPath -Encoding UTF8)
                  if ($xml.package.metadata.version) {
                      $version = $xml.package.metadata.version
                  }
              }

              Write-Host "Committing updates for: $pkg (v$version)"
              git add "automatic/$pkg"
              git commit -m "🤖 Auto-Update: $pkg v$version [skip ci]"
          }

          Write-Host "Pushing all granular commits to main..."
          git push origin main

      - name: Scaffold Missing Dependencies
        shell: pwsh
        run: |
          $scaffoldFile = "var/state/new-packages-to-scaffold.yaml"
          if (Test-Path $scaffoldFile) {
              Import-Module powershell-yaml
              # ConvertFrom-Yaml on a file with just list items returns an array of strings
              $newDeps = Get-Content $scaffoldFile -Raw -Encoding UTF8 | ConvertFrom-Yaml
              
              if ($newDeps) {
                  Write-Host "Found new dependencies to scaffold: $($newDeps | Select-Object -Unique -join ', ')"
                  
                  # Run the Factory to scaffold them all at once and auto-commit
                  $factoryPath = Join-Path $PWD "bin\Manage-ExtensionPool.ps1"
                  & $factoryPath -Add $newDeps -AutoCommit
                  
                  Write-Host "Pushing new dependency scaffolds to main..."
                  git push origin main
              }
          } else {
              Write-Host "No missing dependencies detected."
          }

      - name: Report Failures to Pipeline Summary
        if: always()
        shell: pwsh
        run: |
          $errorFile = "var/state/au_errors.md"
          if (Test-Path $errorFile) {
            "### ❌ Moderation Repush / Custom Build Failures" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            Get-Content $errorFile | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }
          if (Test-Path "Update-AUPackages.md") {
            "### 📊 Chocolatey AU Native Report" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            Get-Content "Update-AUPackages.md" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }